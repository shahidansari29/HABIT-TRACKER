<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HabitHack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border: 1px solid #00ff00;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff00;
            animation: scan 3s linear infinite;
            box-shadow: 0 0 10px #00ff00;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .logo {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .logo span {
            color: #ff0000;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ff00;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .form-group input::placeholder {
            color: rgba(0, 255, 0, 0.5);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #00ff00;
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .links a:hover {
            text-shadow: 0 0 10px #00ff00;
        }

        .error-message {
            color: #ff0000;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            display: none;
        }

        .success-message {
            color: #00ff00;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            display: none;
        }

        .terminal-text {
            color: #00ff00;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
            font-size: 0.8em;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="scan-line"></div>
        <div class="logo">Habit<span>Hack</span></div>
        
        <div class="terminal-text">
$> Welcome to HabitHack v1.0.0<br>
$> System: Habit Tracking Matrix<br>
$> Status: Authentication Required<br>
$> Please enter credentials...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="user@habithack.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn">Access System</button>
        </form>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="links">
            <a href="/register.html">Create Account</a> | 
            <a href="/">Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    successMessage.textContent = '✓ Authentication successful. Redirecting...';
                    successMessage.style.display = 'block';
                    
                    // Show terminal-like message
                    const terminal = document.querySelector('.terminal-text');
                    terminal.innerHTML += `<br>$> Authentication: SUCCESS<br>$> Redirecting to Dashboard...`;
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    errorMessage.textContent = '✗ ' + (data.error || 'Authentication failed');
                    errorMessage.style.display = 'block';
                    
                    const terminal = document.querySelector('.terminal-text');
                    terminal.innerHTML += `<br>$> Authentication: FAILED<br>$> Reason: Invalid credentials`;
                }
            } catch (error) {
                errorMessage.textContent = '✗ Connection error. Please try again.';
                errorMessage.style.display = 'block';
            }
        });

        // Terminal typing effect
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    const terminal = document.querySelector('.terminal-text');
                    terminal.innerHTML += `<br>$> Input focus: ${input.placeholder || input.name}`;
                });
            });
        });
    </script>
</body>
</html>
